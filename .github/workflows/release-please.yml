name: release-please

# Every push to master updates one release pull request (`chore(release): trueline-lint <next>`)
# from the conventional commits since the latest v* release: bumping package.json and CHANGELOG.md.
# Nothing is pushed directly to master, avoiding merge conflicts with local work.
# Merging that pull request creates the v<version> tag and GitHub release, then dispatches release.yml
# to verify and publish to npm via Trusted Publishing (OIDC) + Sigstore provenance.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.repository == 'Jordan-Hall/trueline'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      OWN_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Start the release pipeline on the tag
        if: steps.release.outputs.release_created == 'true' && env.OWN_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
