name: Release

# Every push to main/master automatically publishes a new version to npm
# via Trusted Publishing (OIDC) with Sigstore provenance, commits the version
# bump back, tags vX.Y.Z, and creates a GitHub Release.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/.trueline.allow'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.head_commit.message, 'chore(trueline):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure npm CLI supports OIDC Trusted Publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Compute next version
        id: ver
        run: node scripts/next-version.mjs
      - name: Verify build, types, tests, and self-check
        run: bun run verify
      - name: Publish to npm via Trusted Publishing (OIDC)
        run: npm publish --provenance --access public
      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${{ steps.ver.outputs.version }} [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          git tag -a "v${{ steps.ver.outputs.version }}" -m "trueline-lint v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
