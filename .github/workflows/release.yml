name: Release

# Runs on v* tags (created when merging a release-please PR) or via manual workflow_dispatch.
# Publishes trueline-lint to npm via Trusted Publishing (OIDC) with Sigstore provenance —
# zero static NPM_TOKEN secrets required.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    environment: release
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure npm CLI supports OIDC Trusted Publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Verify build, types, tests, and self-check
        run: bun run verify
      - name: Publish to npm via Trusted Publishing (OIDC)
        run: npm publish --provenance --access public
